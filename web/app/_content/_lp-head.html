<style>
  /* ── Landing Page Scoped Styles — เขียวชุดเดียวกับเว็บหลัก ── */
  .lp{
    --green:#018438;--green-hover:#016b2d;--green-dark:#06351f;--green-darker:#04140c;
    --green-bright:#12b459;--green-light:#5ee08f;--green-pale:#8fe8b3;--green-mute:#a9c6b5;
    --mint:#eafaf0;--mint-alt:#f0f7f2;
    --accent:#e4572e;/* ป้ายเน้น/เร่งด่วนเท่านั้น สีเดียวกับ badge "ขายดี" ในเว็บหลัก */
    --heat:#e8a817;  /* ใช้กับแถบอุณหภูมิอย่างเดียว สื่อความร้อน ไม่ใช่สีแบรนด์ */
    --bg:#ffffff;--bg-alt:#f6f7f3;--text:#0e1a14;--text-muted:#5c6b62;--text-light:#9aa79c;
    --border:#e7eae4;--border-strong:#d9e0da;--white:#fff;--line-green:#06C755;
    --radius:12px;--radius-lg:20px;
    --shadow-sm:0 1px 3px rgba(6,53,31,.08);--shadow-md:0 4px 16px rgba(6,53,31,.1);
    --shadow-lg:0 12px 40px rgba(6,53,31,.14);--shadow-xl:0 20px 60px rgba(6,53,31,.2);
    --content-max:1200px;
    font-family:'IBM Plex Sans Thai',system-ui,sans-serif;color:var(--text);background:var(--bg);
    margin:0;line-height:1.6
  }
  .lp *{box-sizing:border-box;margin:0;padding:0}
  .lp img{max-width:100%;height:auto;display:block}
  .lp a{text-decoration:none;color:inherit}
  .lp-wrap{max-width:var(--content-max);margin:0 auto;padding:0 24px}

  /* ── Buttons ── */
  .lp .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:16px 32px;border-radius:var(--radius);font-weight:600;font-size:16px;cursor:pointer;transition:all .2s ease;border:none;line-height:1.2;font-family:inherit}
  .lp .btn-primary{background:var(--green);color:var(--white)}
  .lp .btn-primary:hover{background:var(--green-hover);transform:translateY(-1px);box-shadow:var(--shadow-md)}
  .lp .btn-primary:disabled{opacity:.7;cursor:default;transform:none}
  .lp .btn-line{background:var(--line-green);color:var(--white)}
  .lp .btn-line:hover{background:#05b04a;transform:translateY(-1px);box-shadow:var(--shadow-md)}
  .lp .btn-phone{background:var(--green-dark);color:var(--white)}
  .lp .btn-phone:hover{background:#0a4a2c;transform:translateY(-1px);box-shadow:var(--shadow-md)}
  .lp .btn-outline{background:transparent;color:var(--green);border:2px solid var(--border-strong)}
  .lp .btn-outline:hover{border-color:var(--green);background:var(--mint)}
  .lp .btn-ghost{background:rgba(255,255,255,.12);color:var(--white);border:1px solid rgba(255,255,255,.3)}
  .lp .btn-ghost:hover{background:rgba(255,255,255,.2)}
  .lp .btn-sm{padding:12px 22px;font-size:14px}
  .lp .btn-lg{padding:18px 38px;font-size:17px}
  .lp .btn svg{width:20px;height:20px;flex-shrink:0}

  /* ── Section ── */
  .lp .section{padding:78px 0}
  .lp .section-alt{background:var(--bg-alt)}
  .lp .section-mint{background:var(--mint-alt)}
  .lp .section-green{background:var(--green-dark);color:var(--white)}
  .lp .section-head{margin-bottom:44px}
  .lp .section-head-center{text-align:center;max-width:720px;margin-left:auto;margin-right:auto}
  .lp .section-tag{display:inline-flex;align-items:center;gap:8px;padding:6px 15px;border-radius:999px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;letter-spacing:1.4px;margin-bottom:15px}
  .lp .section-tag-green{background:var(--mint);color:var(--green)}
  .lp .section-tag-white{background:rgba(255,255,255,.14);color:var(--green-pale)}
  .lp .section-title{font-size:36px;font-weight:700;line-height:1.25;margin-bottom:15px;letter-spacing:-.4px}
  .lp .section-sub{font-size:17px;color:var(--text-muted);line-height:1.75}
  .lp .section-green .section-sub{color:var(--green-mute)}

  /* ── Top Bar ── */
  .lp .topbar{background:var(--green-darker);color:rgba(255,255,255,.85);font-size:13px;padding:9px 0}
  .lp .topbar-inner{display:flex;justify-content:flex-end;align-items:center;gap:28px;flex-wrap:wrap}
  .lp .topbar a{color:rgba(255,255,255,.85)}
  .lp .topbar a:hover{color:var(--white)}
  .lp .topbar-group{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .lp .topbar-item{display:flex;align-items:center;gap:6px}

  /* ── Header ── */
  .lp .header{background:var(--white);border-bottom:1px solid var(--border);padding:14px 0;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm)}
  .lp .header-inner{display:flex;align-items:center;justify-content:space-between;gap:20px}
  .lp .header-logo{display:flex;align-items:center;gap:13px}
  .lp .header-logo img{height:48px;width:auto;border-radius:8px}
  .lp .header-logo-name{font-weight:700;font-size:15px;color:var(--green-dark);letter-spacing:.2px;line-height:1.3}
  .lp .header-logo-sub{font-size:11px;color:var(--text-muted);letter-spacing:.4px}
  .lp .header-cta{display:flex;gap:10px;align-items:center}

  /* ── Hero ── */
  .lp .hero{position:relative;background:linear-gradient(135deg,var(--green-darker) 0%,var(--green-dark) 52%,#0a4a2c 100%);padding:70px 0 88px;overflow:hidden}
  /* รูป hero = วิศวกรวัดความหนาฟิล์มบนคานที่ทาสีกันไฟเสร็จแล้ว (งานจริงของลูกค้า)
     สื่อสองอย่างพร้อมกัน: มีทีมวิศวกร และวัดความหนาจริง ซึ่งเป็นแกนของหน้านี้ */
  .lp .hero::before{content:'';position:absolute;inset:0 0 0 42%;background:url('/images/hero-dft-inspection.webp') center/cover no-repeat;opacity:.22;mask-image:linear-gradient(to left,rgba(0,0,0,.8),transparent);-webkit-mask-image:linear-gradient(to left,rgba(0,0,0,.8),transparent)}
  .lp .hero-grid{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
  .lp .hero-badge{display:inline-flex;align-items:center;gap:9px;padding:7px 15px;border:1px solid rgba(94,224,143,.4);border-radius:999px;background:rgba(18,180,89,.15);font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.6px;color:var(--green-pale);margin-bottom:22px}
  .lp .hero-badge i{width:7px;height:7px;border-radius:50%;background:var(--green-bright);display:inline-block;font-style:normal}
  /* /neocoat ขอให้ป้ายมาตรฐานใหญ่ขึ้นเล็กน้อย แต่ยังต้องเล็กกว่า h1 (46px) ชัดเจน
     แยกเป็นคลาสเสริมแทนการแก้ .hero-badge ตรงๆ เพราะ landing page อีก 5 หน้า
     ใช้คลาสเดียวกันอยู่ ยังไม่ได้สั่งให้เปลี่ยนตาม */
  .lp .hero-badge-lg{font-size:13.5px;letter-spacing:.7px;padding:9px 18px;gap:10px}
  .lp .hero-badge-lg i{width:8px;height:8px}
  .lp .hero h1{font-size:46px;line-height:1.14;font-weight:700;color:var(--white);letter-spacing:-.7px;margin-bottom:20px}
  .lp .hero h1 em{font-style:normal;color:var(--green-light)}
  .lp .hero-lead{font-size:17.5px;line-height:1.75;color:#c9ddd0;margin-bottom:26px;max-width:540px}
  .lp .hero-points{list-style:none;margin-bottom:30px;display:grid;gap:11px}
  .lp .hero-points li{display:flex;align-items:flex-start;gap:11px;color:#dbeade;font-size:15.5px;line-height:1.6}
  .lp .hero-points svg{width:21px;height:21px;flex-shrink:0;margin-top:1px;color:var(--green-light)}
  .lp .hero-actions{display:flex;gap:12px;flex-wrap:wrap}
  .lp .hero-trust{margin-top:32px;padding-top:26px;border-top:1px solid rgba(255,255,255,.16);display:flex;gap:30px;flex-wrap:wrap}
  .lp .hero-trust-item{display:flex;flex-direction:column;gap:3px}
  .lp .hero-trust-k{font-size:19px;font-weight:700;color:var(--green-light);line-height:1.2}
  .lp .hero-trust-v{font-size:12.5px;color:var(--green-mute)}

  /* ── Hero Figure ──
     รูปเป็น PNG/WebP ที่ตัดพื้นหลังออกแล้ว (โปร่งใส) จึงไม่ต้องมีกรอบการ์ด
     ห้ามใส่ object-fit:cover หรือ aspect-ratio ตายตัว เพราะจะครอปถังซ้าย-ขวาหาย
     ปล่อยให้สูงตามสัดส่วนจริงของไฟล์ */
  .lp .hero-figure{position:relative;text-align:center}
  .lp .hero-figure img{width:100%;height:auto;display:block;filter:drop-shadow(0 20px 34px rgba(0,0,0,.45))}
  /* หน้าที่รูป hero เป็นสินค้าชิ้นเดียวแนวตั้ง (เช่น /thinner) ถ้าปล่อยเต็ม 100%
     ของคอลัมน์ รูปจะสูงกว่าคอลัมน์ข้อความไปมาก จำกัดความกว้างแล้วจัดกลางแทน
     (/thinner เปลี่ยนเป็นรูปสองกระป๋องคู่ ซึ่งเป็นแนวนอนแล้ว ไม่ใช่ทรงสูงแบบเดิม
     จึงขยับ cap ขึ้นจาก 330 ไม่งั้นจะดูเล็กเกินไปเมื่อเทียบกับคอลัมน์ข้อความ) */
  .lp .hero-figure-sm img{max-width:480px;margin-left:auto;margin-right:auto}
  .lp .hero-figure-flag{display:inline-flex;align-items:center;background:var(--accent);color:var(--white);font-size:12px;font-weight:600;padding:6px 15px;border-radius:7px;letter-spacing:.2px;margin-bottom:16px}
  .lp .hero-figure figcaption{padding-top:16px;font-size:13px;color:var(--green-mute);text-align:center;line-height:1.65}
  /* ── Lab strip ── */
  .lp .labs{background:var(--white);border-bottom:1px solid var(--border);padding:26px 0}
  .lp .labs-inner{display:flex;align-items:center;justify-content:center;gap:14px 44px;flex-wrap:wrap}
  .lp .labs-label{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:1.4px;color:var(--text-light)}
  .lp .lab{display:flex;flex-direction:column;gap:2px}
  .lp .lab-n{font-size:14.5px;font-weight:700;color:var(--green-dark)}
  .lp .lab-m{font-size:12px;color:var(--text-muted)}

  /* ── กฎกระทรวง: ตารางชั่วโมงทนไฟ ── */
  .lp .law-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:26px}
  .lp .law-card{border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px 24px;background:var(--white);position:relative;overflow:hidden}
  .lp .law-card::after{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--green)}
  .lp .law-hr{font-size:40px;font-weight:700;color:var(--green);line-height:1;letter-spacing:-1px;margin-bottom:8px}
  .lp .law-hr span{font-size:17px;font-weight:600}
  .lp .law-floor{font-size:16.5px;font-weight:600;margin-bottom:7px;line-height:1.45}
  .lp .law-desc{font-size:14px;color:var(--text-muted);line-height:1.65}
  .lp .law-note{background:var(--mint);border-radius:var(--radius);padding:18px 22px;font-size:14.5px;line-height:1.7;color:var(--text-muted)}
  .lp .law-note b{color:var(--text)}

  /* ── Product compare ── */
  .lp .prod-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
  .lp .prod-grid-3{grid-template-columns:repeat(3,1fr);gap:22px}
  .lp .prod{border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;background:var(--white);display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s}
  .lp .prod:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
  .lp .prod-top{position:relative;height:210px;background:var(--white) url('/images/neocoat-paint-s.png') center/contain no-repeat;border-bottom:1px solid var(--border)}
  .lp .prod-top.w{background-image:url('/images/neocoat-paint-w.png')}
  .lp .prod-flag{position:absolute;top:14px;left:14px;background:var(--accent);color:var(--white);font-size:11.5px;font-weight:600;padding:5px 12px;border-radius:6px}
  .lp .prod-flag.green{background:var(--green-bright);color:var(--green-darker)}
  .lp .prod-body{padding:24px;display:flex;flex-direction:column;flex:1 1 auto}
  .lp .prod-name{font-size:19px;font-weight:700;line-height:1.35;margin-bottom:8px}
  .lp .prod-for{font-size:14px;color:var(--text-muted);line-height:1.65;margin-bottom:16px}
  .lp .prod-spec{list-style:none;margin-bottom:18px;display:grid;gap:8px}
  .lp .prod-spec li{display:flex;justify-content:space-between;gap:14px;font-size:13.5px;padding-bottom:8px;border-bottom:1px dashed var(--border)}
  .lp .prod-spec span:first-child{color:var(--text-muted)}
  .lp .prod-spec span:last-child{font-weight:600;text-align:right}
  .lp .prod-unit{font-size:12.5px;color:var(--text-muted);margin-bottom:18px}
  .lp .prod-cta{margin-top:auto;display:grid;gap:9px}

  /* ── ตารางสเปกเทียบ ──
     การ์ดสินค้าเก็บแค่ข้อมูลย่อ สเปกเต็มมาอยู่ที่ตารางนี้ หน้ายิงแอดจึงไม่ต้อง
     ส่งคนออกไปหน้าสินค้าเพื่อดูสเปก ซึ่งเท่ากับปล่อยให้หลุดจากกรวยไป
     ตารางกว้างเกินจอมือถือแน่นอน จึงให้เลื่อนแนวนอนในกล่องตัวเอง ไม่ดันทั้งหน้า */
  .lp .spec-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--white);-webkit-overflow-scrolling:touch}
  .lp .spec-table{width:100%;min-width:780px;border-collapse:collapse;font-size:14.5px}
  .lp .spec-table th,.lp .spec-table td{padding:14px 18px;text-align:left;vertical-align:top;line-height:1.65;border-bottom:1px solid var(--border)}
  .lp .spec-table thead th{background:var(--bg-alt);font-size:14px;font-weight:700;color:var(--text)}
  .lp .spec-table tbody th{width:150px;font-weight:600;color:var(--text-muted);white-space:nowrap}
  .lp .spec-table tbody td{color:var(--text)}
  .lp .spec-table tbody tr:last-child th,.lp .spec-table tbody tr:last-child td{border-bottom:0}
  .lp .spec-na{color:var(--text-light)}

  /* ── ระบบ 3 ชั้น ── */
  .lp .layers{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .lp .layer{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:26px 24px;position:relative}
  .lp .layer-n{width:42px;height:42px;border-radius:50%;background:var(--mint);border:2px solid var(--green);color:var(--green);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;margin-bottom:15px}
  .lp .layer.is-ours{border-color:var(--green);box-shadow:0 0 0 3px var(--mint)}
  .lp .layer.is-ours .layer-n{background:var(--green);color:var(--white)}
  .lp .layer-t{font-size:17px;font-weight:700;margin-bottom:8px}
  .lp .layer-d{font-size:14px;color:var(--text-muted);line-height:1.7}
  .lp .layer-tag{display:inline-block;margin-top:12px;font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:6px;background:var(--mint);color:var(--green)}

  /* ── กลไก char ── */
  .lp .how-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
  /* grid item ได้ min-width:auto มาโดยปริยาย = ยุบเล็กกว่า min-content ตัวเองไม่ได้
     ข้อความไทยไม่มีเว้นวรรค min-content เลยกว้างเป็นร้อยพิกเซล พอ /engineering
     เอา .car (คารูเซล) มาวางในคอลัมน์ คอลัมน์ 1fr เลยถูกดันเป็น 702px ทะลุจอ
     มือถือ แล้วโดน clip ทิ้งครึ่งหนึ่ง — min-width:0 ปลดล็อกให้ยุบตามคอลัมน์ได้
     ส่วนการเลื่อนดูรูปยังทำได้ตามเดิมด้วย overflow-x ของ .car-track
     (รวม .hero-grid ด้วย เพราะ /fire-blanket เอา .car มาวางในคอลัมน์ hero) */
  .lp .how-grid > *,.lp .thick-grid > *,.lp .hero-grid > *,.lp .car{min-width:0}
  .lp .how-steps{list-style:none;display:grid;gap:20px}
  .lp .how-step{display:flex;gap:16px}
  .lp .how-step-n{width:34px;height:34px;border-radius:50%;background:rgba(94,224,143,.16);border:1px solid rgba(94,224,143,.4);color:var(--green-light);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
  .lp .how-step-t{font-size:16.5px;font-weight:600;margin-bottom:5px;color:var(--white)}
  .lp .how-step-d{font-size:14.5px;line-height:1.7;color:var(--green-mute)}
  .lp .how-fig{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:var(--radius-lg);padding:30px}
  .lp .how-temp{display:grid;gap:16px}
  .lp .how-temp-row{display:flex;align-items:center;gap:16px}
  .lp .how-temp-bar{flex:1;height:9px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
  .lp .how-temp-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green-bright),var(--green-light))}
  .lp .how-temp-fill.hot{background:linear-gradient(90deg,var(--heat),var(--accent))}
  .lp .how-temp-k{font-size:13px;color:var(--green-mute);width:112px;flex-shrink:0}
  .lp .how-temp-v{font-size:13.5px;font-weight:700;color:var(--white);width:74px;text-align:right;flex-shrink:0}
  .lp .how-note{margin-top:22px;padding-top:20px;border-top:1px solid rgba(255,255,255,.14);font-size:13.5px;line-height:1.7;color:var(--green-mute)}

  /* ── ความหนา / Hp/A ── */
  .lp .thick-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:46px;align-items:center}
  .lp .thick-list{list-style:none;display:grid;gap:16px;margin-top:22px}
  .lp .thick-list li{display:flex;gap:13px;font-size:15px;line-height:1.7;color:var(--text-muted)}
  .lp .thick-list svg{width:20px;height:20px;color:var(--green);flex-shrink:0;margin-top:3px}
  .lp .calc{background:var(--green-dark);border-radius:var(--radius-lg);padding:34px;color:var(--white)}
  .lp .calc-t{font-size:21px;font-weight:700;margin-bottom:10px;line-height:1.4}
  .lp .calc-d{font-size:14.5px;color:var(--green-mute);line-height:1.75;margin-bottom:22px}
  .lp .calc-rows{display:grid;gap:12px;margin-bottom:24px}
  /* ค่าเริ่มต้นเป็นโทนพื้นสว่าง — /fire-blanket กับ /roof-shield เอาแถวสเปกนี้ไป
     วางบน section พื้นอ่อนโดยไม่มีกล่อง .calc ครอบ ของเดิมตั้งสีไว้สำหรับพื้น
     เขียวเข้มอย่างเดียว (#a9c6b5 บน #f6f7f3 = คอนทราสต์ ~1.9:1) เลยจางจนอ่านไม่ออก */
  .lp .calc-row{display:flex;justify-content:space-between;gap:14px;font-size:14px;padding-bottom:11px;border-bottom:1px solid var(--border)}
  .lp .calc-row span:first-child{color:var(--text-muted)}
  .lp .calc-row span:last-child{font-weight:600;text-align:right;color:var(--text)}
  /* ในกล่อง .calc พื้นเขียวเข้ม ต้องกลับเป็นโทนสว่างเหมือนเดิม */
  .lp .calc .calc-row{border-bottom-color:rgba(255,255,255,.13)}

  .lp .car-btn{position:absolute;top:calc(50% - 18px);transform:translateY(-50%);width:40px;height:40px;padding:0;border:0;border-radius:50%;background:rgba(4,20,12,.55);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s,opacity .2s}

  .lp .car-stage:not(:has(figcaption)) .car-btn{top:50%}
